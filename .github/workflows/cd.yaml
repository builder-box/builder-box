name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  # Git hooks (husky) must not run in pipelines.
  HUSKY: 0

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TODO: define the release flow (Changesets: `changeset version` +
      # `changeset publish`, or semantic-release) and implement it here.
      - name: Placeholder
        run: |
          echo "TODO: flesh out the CD pipeline"
